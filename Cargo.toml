[package]
name = "villager-bucket"
version = "0.1.0"
edition = "2024"
description = "Carry a villager in a bucket without losing its identity or saved state."
authors = ["Strawberry Interactive LLC"]
license = "LicenseRef-Strawberry-Source-Available-1.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strawberry-plugin-api = { version = "=0.2.2", registry = "strawberry" }
custom-models-api = { path = "libs/custom-models-api" }

# A repository of its own, not a member of a larger workspace.
[workspace]
members = ["libs/custom-models-api"]
